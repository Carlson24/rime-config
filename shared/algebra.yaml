zrm_pro:
  __append:
    - xform/Ⅱ//
    - xlit/12345/67890/
    # 一些兼容打法
    - derive/^ng(\d);/eng$1;/
    - derive/^([jqxy])v(\d);/$1u$2;/ # jv -> ju
    - derive/^([gkhzcs])v(\d);/$1u$2;/ # zv -> zu
    - derive/^([aoe])([ioun])(\d);/$1$1$2$3;/
    # 零声母
    - xform/^([aoe])(ng)?(\d);/$1$1$2$3;/
    - xform/^n(\d);/en$1;/ # n 使用 en
    - xform/^m(\d);/mv$1;/ # m 使用 mv
    # 处理 z/c/s + ii
    - xform/^zii(\d);/Oi$1;/
    - xform/^cii(\d);/Ei$1;/
    - xform/^sii(\d);/Ai$1;/
    - xform/ii(\d);/i$1;/
    # 尖音 z/c/s + i/v -> o/e/a
    - xform/^z([iv])([a-z]+)(\d);/O$1$2$3;/
    - xform/^c([iv])([a-z]+)(\d);/E$1$2$3;/
    - xform/^s([iv])([a-z]+)(\d);/A$1$2$3;/
    # 团音 g/k/h + i/v -> j/q/x
    - xform/^g([iv])/J$1/
    - xform/^k([iv])/Q$1/
    - xform/^h([iv])/X$1/
    # 韵母处理
    - xform/iai(\d);/L$1;/
    - xform/iu(\d);/Q$1;/
    - xform/[uv]an(\d);/R$1;/
    - xform/[uv]e(\d);/T$1;/
    - xform/ing(\d);/Y$1;/
    - xform/[uv]ai(\d);/Y$1;/
    - xform/[uv]o(\d);/O$1;/
    - xform/[uv]n(\d);/P$1;/
    - xform/i?ong(\d);/S$1;/
    - xform/[iu]ang(\d);/D$1;/
    - xform/eng(\d);/G$1;/
    - xform/ang(\d);/H$1;/
    - xform/ian(\d);/M$1;/
    - xform/iao(\d);/C$1;/
    - xform/ie(\d);/X$1;/
    - xform/[uv]i(\d);/V$1;/
    - xform/in(\d);/N$1;/
    - xform/[iu]a(\d);/W$1;/
    - xform/([a-z]+)ao(\d);/$1K$2;/
    - xform/([a-z]+)ai(\d);/$1L$2;/
    - xform/([a-z]+)ei(\d);/$1Z$2;/
    - xform/([a-z]+)an(\d);/$1J$2;/
    - xform/([a-z]+)en(\d);/$1F$2;/
    - xform/([a-z]+)ou(\d);/$1B$2;/
    # zh/ch/sh -> v/i/u
    - xform/^zh/V/
    - xform/^ch/I/
    - xform/^sh/U/
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/qwertyuiopasdfghjklzxcvbnm/

