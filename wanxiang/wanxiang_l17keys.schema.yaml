# @format

# Rime schema
# encoding: utf-8

schema:
  schema_id: wanxiang_l17keys
  name: 乱序17·万象
  version: "LTS"
  author: amzxyz & Carlson24
  description: 万象拼音Pro
  dependencies:
    - wanxiang_english
    - wanxiang_l17keys_reverse

__include: shared_config.yaml:/shared_config

key_binder:
  __include: shared_config.yaml:/key_binder

super_comment:
  __include: shared_config.yaml:/super_comment

wanxiang_english:
  __include: shared_config.yaml:/wanxiang_english

switches:
  __include: shared_config.yaml:/switches

engine:
  processors:
    - user_predict_processor # 必须放在第一个
    - lua_processor@*wanxiang.super_processor
    - lua_processor@*chaifen_tips
    - ascii_composer
    - digit_catcher # 需要在 ascii_composer 之后 recognizer 之前
    - recognizer
    - key_binder
    - lua_processor@*moran_pin*pin_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@wanxiang_reverse
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - user_predict_translator
    - calculator_translator
    - lua_translator@*unicode
    - lua_translator@*number_cover
    - lua_translator@*input_statistics
    - table_translator@custom_phrase
    - lua_translator@*wanxiang.super_english*T
    - reverse_lookup_translator@wanxiang_flypy_reverse
    - lua_translator@*moran_pin*panacea_translator
  filters:
    - lua_filter@*moran_pin*pin_filter
    - lua_filter@*wanxiang.super_english*F
    - lua_filter@*wanxiang.super_lookup
    - lua_filter@*wanxiang.super_comment_preedit
    - rewriter@commit
    - user_predict_filter # 去重、简繁转换之前
    - rewriter@others
    - rewriter@emoji
    - rewriter@kaomoji
    - rewriter@s2t
    - rewriter@hk_variants
    - rewriter@tw_variants
    - rewriter@translate
    - lua_filter@*placeholder
    - uniquifier # 候选去重

speller:
  # auto_select: true # 自动上屏
  # auto_select_pattern: ^@(\w|@)+|^\w{3}\w+ # 自动上屏规则
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA67890`/@
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/@
  delimiter: " '"
  visual_delimiter: " "
  algebra:
    __patch:
      - "algebra:/fuzzy/in_ing"
      - "algebra:/l17_pro"
      - "algebra:/aux"

translator:
  dictionary: wanxiang.zian
  prism: wanxiang_l17keys # 多方案唯一标识
  enable_completion: true # 开启编码补全
  enable_user_dict: true # 启用用户词典
  user_dict: user_flypy # 用户词典的文件名称
  disable_user_dict_for_patterns:
    - "^[a-zA-Z0-9]{1,6}$" # 三字以内不调频
  contextual_suggestions: false # 不好用，还严重影响性能
  max_sentences: 1 # 越多性能越差
  max_homophones: 8
  enable_correction: false # 关闭输入纠错——使用 typo_filter 代替
  initial_quality: 4
  spelling_hints: 48
  always_show_comments: false
  comment_format:

wanxiang_l17keys_reverse:
  tag: wanxiang_reverse
  dictionary: wanxiang_reverse
  prism: wanxiang_l17keys_reverse
  enable_completion: true
  prefix: "`"
  tips: "〔反查：拆分|笔画〕"

wanxiang_lookup:
  key: "`"
  tags: [abc]
  aux_file: "flypy_aux.txt"

recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]+)$"
    wanxiang_reverse: "^`[A-Za-z]*$"
    unicode: "^U[a-fA-F0-9]+"
    Snumber: "^S[0-9\\.]+"
    Ndate: "^N[0-9]+"
    calculator: "^(V.*|[0-9]+[\\+\\-\\*].*|[\\+\\-\\*].*)$"
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"

punctuator:
  digit_separators: ":,."
  __include: "user_symbols:/symbol_table"
  __patch: "user_symbols:/symbols"
