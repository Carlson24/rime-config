# @format

# Rime schema
# encoding: utf-8

schema:
  schema_id: wanxiang_flypy
  name: 小鹤音形·万象
  version: "LTS"
  author: amzxyz & Carlson24
  description: 小鹤音形+万象拼音Pro
  dependencies:
    - wanxiang_english
    - wanxiang_flypy_reverse

__include: shared_config.yaml:/shared_config

flypy:
  __include: shared_config.yaml:/flypy

speller:
  # auto_select: true # 自动上屏
  # auto_select_pattern: ^@(\w|@)+|^\w{3}\w+ # 自动上屏规则
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/@`
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/@
  delimiter: " '"
  visual_delimiter: " "
  algebra:
    __patch:
      - "algebra:/flypy_pro"
      - "algebra:/aux"

translator:
  dictionary: wanxiang.flypy.zian
  prism: wanxiang_flypy # 多方案唯一标识
  enable_completion: true # 开启编码补全
  enable_user_dict: true # 启用用户词典
  user_dict: user_flypy # 用户词典的文件名称
  disable_user_dict_for_patterns:
    - "^[a-z]{1,4}$" # 四码以内不调频
  contextual_suggestions: false # 不好用，还严重影响性能
  max_sentences: 1 # 越多性能越差
  max_homophones: 8
  enable_correction: false # 关闭输入纠错
  initial_quality: 4
  spelling_hints: 48
  always_show_comments: false
  comment_format:

wanxiang_flypy_reverse:
  tag: wanxiang_reverse
  dictionary: wanxiang_reverse
  prism: wanxiang_flypy_reverse
  enable_completion: true
  prefix: "`"
  tips: "〔反查：拆分|笔画〕"
