# @format

# Rime schema settings
# encoding: utf-8
schema:
  schema_id: wanxiang_flypy_18keys_reverse
  name: "18键·万象小鹤·拆分与笔画反查"
  version: "LTS"
  author: amzxyz
  description: 万象的反查功能模块，方案融合了组字与笔画的能力
engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - echo_translator
    - table_translator
  filters:
    - uniquifier

key_binder:
  __include: default:/key_binder?

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  delimiter: " '"
  algebra:
    __patch:
      - "algebra:/flypy_reverse"
      - "algebra:/18keys"

translator:
  dictionary: wanxiang_reverse
  prism: wanxiang_flypy_18keys_reverse
  enable_user_dict: false
